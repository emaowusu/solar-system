name: Solar System Workflow

on:
  push:
    branches:
      - 'feature/*'

jobs:
  testing:
    strategy:
      matrix: 
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Testing on Ubuntu
        run: |
          export apikey=$3CuR3-toKEN
          echo "Running Tests... ..."
      - name: Testing on Windows
        run: |
          Set-Variable -Name "apikey" -Value "$3CuR3-toKEN"
          echo "Running Tests... ..."
  reports:
    needs: testing
    runs-on: ubuntu-latest
    steps:
      - name: Upload Report to AWS S3
        run: echo "Uploading reports ... ..." && exit 1
  deploy:
    runs-on: ubuntu-latest
    needs: reports
